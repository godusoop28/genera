services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: c21genera
      POSTGRES_USER: c21genera
      POSTGRES_PASSWORD: c21genera
    ports:
      - "5432:5432"
    volumes:
      - c21genera-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U c21genera -d c21genera"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: c21genera
      MINIO_ROOT_PASSWORD: c21genera-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - c21genera-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 c21genera c21genera-local-only &&
      mc mb -p local/c21genera-expedientes &&
      exit 0
      "

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web para ver los correos capturados

volumes:
  c21genera-postgres-data:
  c21genera-minio-data:
