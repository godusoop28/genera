spring:
  application:
    name: c21genera-backend
  # Un solo hilo para todos los @Scheduled (procesamiento, extracción con IA, correos): los trabajos
  # pesados (renderizar un PDF de 40 MB, llamar a la IA) corren de uno en uno y el resto espera en QUEUED.
  # En una instancia de 512 MB dos a la vez no caben. No subirlo sin medir la memoria (/actuator/info).
  task:
    scheduling:
      pool:
        size: 1
  modulith:
    events:
      # Si el servidor se reinicia entre el commit y la entrega de un evento asíncrono (p. ej.
      # "documento procesado" -> encolar la extracción), el evento queda incompleto en
      # event_publication; con esto se vuelve a entregar al arrancar en vez de perderse (E2E 02/10).
      republish-outstanding-events-on-restart: true
  main:
    # El free tier de Render (0.1 CPU) hace que el arranque completo tarde
    # varios minutos; lazy-init evita crear beans que no se tocan al
    # arrancar (S3Client, servicios de módulos no usados por los seeders,
    # controladores REST, etc.). Flyway y los ApplicationRunner (seeders)
    # siguen ejecutándose eagerly: Spring Boot resuelve los Runners por tipo
    # después del refresh, y eso arrastra a Flyway vía @DependsOn en el
    # EntityManagerFactory.
    lazy-initialization: true
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      # Sin esto Spring limita cada archivo a 1 MB y casi cualquier foto de
      # celular se rechazaba como "demasiado pesada". El límite real por
      # archivo lo aplica FileValidator (app.upload.max-file-size-bytes); este
      # es solo el tope del servidor web, un poco mayor para que el mensaje
      # de error sea el de la aplicación. Los archivos se reciben en disco.
      max-file-size: ${UPLOAD_MAX_FILE_SIZE_MB:101}MB
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE_MB:250}MB
      file-size-threshold: 1MB
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

management:
  info:
    env:
      enabled: true
    # Memoria del proceso y versión de Java en /actuator/info: permite saber si un reinicio en Render
    # fue por falta de memoria (E2E 02/10: 502 intermitentes sin despliegue de por medio).
    process:
      enabled: true
    java:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

# /actuator/info muestra qué commit está desplegado (Render define RENDER_GIT_COMMIT): permite
# confirmar que un fix ya está en producción antes de volver a probar.
info:
  app:
    commit: ${RENDER_GIT_COMMIT:local}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%X{correlationId}] %-5level %logger{36} - %msg%n"

# Configuración propia de la aplicación (ver shared.config.AppProperties).
# Ningún secreto tiene valor por defecto: deben suministrarse por variable de
# entorno (ver backend/.env.example).
app:
  organization:
    legal-name: "Grupo WILGEN y Asociados S. de R.L. de C.V."
    commercial-name: "CENTURY 21 Genera"
    profeco-registration: "7/002193-2026"
  security:
    jwt:
      issuer: "c21genera-backend"
      access-ttl: PT15M
      refresh-ttl: P30D
      secret: ${JWT_SECRET:}
    public-link:
      base-url: ${PUBLIC_LINK_BASE_URL:https://genera-puce.vercel.app/carga}
      # Vigencia de cada liga de cliente; después hay que generar una nueva.
      ttl: ${PUBLIC_LINK_TTL:P30D}
    # Control de Cambios #25: enlaces de un solo uso para definir contraseña
    # (alta y restablecimiento) y bloqueo tras intentos fallidos.
    account:
      link-base-url: ${ACCOUNT_LINK_BASE_URL:https://genera-puce.vercel.app/acceso}
      invite-ttl: PT72H
      reset-ttl: PT24H
      max-failed-logins: 5
      lock-duration: PT15M
    cors:
      allowed-origins: ${FRONTEND_URL:http://localhost:3000}
  storage:
    # "s3" (MinIO/AWS S3/Cloudflare R2) o "cloudinary".
    provider: ${STORAGE_PROVIDER:s3}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:c21genera-expedientes}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    path-style-access: true
    presigned-url-ttl: PT10M
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  upload:
    # 100 MB por archivo (Control de Cambios #4): escrituras y testimonios notariales
    # escaneados de muchas páginas, sin pedirle al cliente que baje la calidad.
    # Con Cloudinary (máx. 10 MB por objeto en el plan gratuito) los archivos
    # grandes se guardan en partes de forma transparente (CloudinaryFileStorage).
    max-file-size-bytes: ${UPLOAD_MAX_FILE_SIZE_BYTES:104857600}
    max-files-per-request: 30
    # HEIC/HEIF (iPhone) se convierte a JPEG en el navegador antes de subirse.
    allowed-public-mime-types: image/jpeg,image/png,image/webp,application/pdf
    allowed-internal-mime-types: image/jpeg,image/png,image/webp,application/pdf
  mail:
    from: ${MAIL_FROM:no-reply@c21genera.com}
  ai:
    enabled: ${AI_ENABLED:false}
    provider: ${AI_PROVIDER:openai}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    # Los modelos de razonamiento con varias páginas de imagen pueden tardar más de 30 s.
    timeout: ${AI_TIMEOUT:PT120S}
    max-retries: 2
    # Documentos largos: se revisan por lotes hasta encontrar los datos (inicio,
    # final y luego el resto), con este tope de páginas por documento.
    max-pages: ${AI_MAX_PAGES:96}
    pages-per-batch: ${AI_PAGES_PER_BATCH:8}
  # Factibilidad comercial con IA (misma llave AI_API_KEY). Corre en segundo plano en OpenAI con
  # búsqueda web: el análisis completo suele tardar varios minutos.
  feasibility:
    # Vacío = el mismo AI_MODEL de la extracción de documentos.
    model: ${FEASIBILITY_MODEL:}
    reasoning-effort: ${FEASIBILITY_REASONING_EFFORT:medium}
    max-output-tokens-report: ${FEASIBILITY_MAX_OUTPUT_TOKENS_REPORT:100000}
    max-output-tokens-presentation: ${FEASIBILITY_MAX_OUTPUT_TOKENS_PRESENTATION:50000}
    stage-timeout: ${FEASIBILITY_STAGE_TIMEOUT:PT45M}
  # Integración de solo lectura con 21Online (inventario) — ver online21.infrastructure.Online21Properties.
  online21:
    base-url: ${ONLINE21_BASE_URL:https://plus.21onlinemx.com}
    # Llave JWT de 21Online (Mi Perfil → API Keys). Vacía = integración apagada.
    api-key: ${ONLINE21_API_KEY:}
    auth-prefix: ${ONLINE21_AUTH_PREFIX:Bearer }
    # Enlace público de la ficha para mandar al cliente, con {id}. Vacío = sin enlace.
    public-url-template: ${ONLINE21_PUBLIC_URL_TEMPLATE:}
    refresh-interval: ${ONLINE21_REFRESH_INTERVAL:PT3H}
    # Registrar cada lead como prospecto en 21Online (POST /api/prospectos).
    push-prospects: ${ONLINE21_PUSH_PROSPECTS:false}
  # Asistente de WhatsApp (misma llave de OpenAI que app.ai) — ver assistant.infrastructure.AssistantProperties.
  assistant:
    # OFF (solo guarda mensajes), TEST_ONLY (simulador y números de prueba) u ON.
    mode: ${ASSISTANT_MODE:OFF}
    # Vacío = el mismo AI_MODEL de la extracción de documentos.
    model: ${ASSISTANT_MODEL:}
    # low/medium/high para modelos de razonamiento; vacío = no se envía.
    reasoning-effort: ${ASSISTANT_REASONING_EFFORT:low}
    debounce: PT6S
    max-wait: PT25S
    max-clarifications: 3
    session-idle: PT6H
    # Canaliza a quien mostró interés y dejó de responder (0 = nunca).
    abandon-handoff-after: ${ASSISTANT_ABANDON_AFTER:PT30M}
    turn-timeout: PT40S
    # Números (wa_id, solo dígitos, separados por coma) que reciben respuesta en TEST_ONLY.
    test-wa-ids: ${ASSISTANT_TEST_WA_IDS:}
  # WhatsApp Cloud API (Meta) — ver assistant.infrastructure.WhatsAppProperties.
  whatsapp:
    api-version: ${WHATSAPP_API_VERSION:v23.0}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:}
    app-secret: ${WHATSAPP_APP_SECRET:}
    # Plantilla aprobada para avisar al asesor (un parámetro de cuerpo). Vacío = texto libre.
    advisor-template: ${WHATSAPP_ADVISOR_TEMPLATE:}
    advisor-template-language: ${WHATSAPP_ADVISOR_TEMPLATE_LANGUAGE:es_MX}
  rate-limit:
    login:
      capacity: 10
      refill-period: PT1M
    public-submit:
      capacity: 20
      refill-period: PT1M
    upload:
      capacity: 60
      refill-period: PT1M
  contracts:
    # El PDF del contrato (el que se firma) lo genera el propio backend con
    # PDFBox; ya no se necesita LibreOffice.
    # Liga personal de firma de cada firmante del cliente (frontend /firma/<token>).
    # Vacío = se deriva de PUBLIC_LINK_BASE_URL (mismo dominio, ruta /firma).
    signing-base-url: ${SIGNING_BASE_URL:}
    signing-link-ttl: ${SIGNING_LINK_TTL:P15D}

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/c21genera}
    username: ${DATABASE_USERNAME:c21genera}
    password: ${DATABASE_PASSWORD:c21genera}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

app:
  security:
    jwt:
      # Solo para desarrollo local: en producción JWT_SECRET es obligatorio
      # (ver JwtKeyConfig, que falla al iniciar si está vacío fuera de local/test).
      secret: ${JWT_SECRET:local-dev-only-secret-key-0123456789abcdef}
  dev-seed:
    enabled: true
    admin-name: "Jorge Ricardo Jurado Espinal"
    admin-email: ${DEV_ADMIN_EMAIL:admin@demo.local}
    admin-password: ${DEV_ADMIN_PASSWORD:}
    seed-demo-expediente: true

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    enabled: true

app:
  security:
    jwt:
      secret: "test-only-secret-key-not-for-production-use-0123456789"
  ai:
    enabled: false
  dev-seed:
    enabled: false

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}

app:
  dev-seed:
    enabled: false
